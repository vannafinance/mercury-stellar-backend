<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <style>
    @keyframes chatgpt-pen-wiggle {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-9deg) translate(-1px, 1px); }
      45% { transform: rotate(5deg) translate(1px, -0.5px); }
      70% { transform: rotate(-3deg); }
      100% { transform: rotate(0deg); }
    }
    .pen-writer {
      transform-origin: 8px 16px;
      transition: transform 0.2s ease;
    }
    :hover .pen-writer,
    .pen-writer:hover {
      animation: chatgpt-pen-wiggle 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
  <!-- Document pad with open top-right corner for the stylus -->
  <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
  <!-- ChatGPT stylus group -->
  <g class="pen-writer">
    <path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z" />
    <path d="m15 5 3 3" />
  </g>
</svg>
